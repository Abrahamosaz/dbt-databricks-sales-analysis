dbt_databricks_sales_analysis:
  target: dev
  outputs:
    dev:
      type: databricks
      catalog: "{{ env_var('DATABRICKS_CATALOG', 'your_catalog') }}"
      schema: "{{ env_var('DATABRICKS_SCHEMA', 'your_schema') }}"
      host: "{{ env_var('DATABRICKS_HOST', 'your-workspace.cloud.databricks.com') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH', '/sql/1.0/warehouses/your_warehouse_id') }}"
      token: "{{ env_var('DATABRICKS_TOKEN', 'your_personal_access_token') }}"
      threads: 4
